<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// ---------- core ----------
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1280, H = +Q.get('h') || 720;
const SCENE = Q.get('scene') || 'circuit';
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2, T = 8;
const C = { bg:'#07152c', deep:'#040c1c', navy:'#0c1f3f', cyan:'#22d3ee', cyanL:'#a5f3fc', blue:'#5b9dff', violet:'#a78bfa', mag:'#f472b6', white:'#eef5ff', amber:'#fbbf24', green:'#4ade80', gold:'#d4a84a' };
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const wave=(p,k=1,o=0)=>0.5-0.5*Math.cos(TAU*(p*k+o)); // 0..1 periodic
const S = Math.min(W,H)/720; // scale unit

// film grain (4 frames, cycled)
const grains=[...Array(4)].map((_,i)=>{const g=document.createElement('canvas');g.width=g.height=256;const gx=g.getContext('2d');const id=gx.createImageData(256,256);const r=rng(99+i);for(let k=0;k<id.data.length;k+=4){const v=r()*255;id.data[k]=id.data[k+1]=id.data[k+2]=v;id.data[k+3]=255}gx.putImageData(id,0,0);return g});
let finishOpts={};
function finish(frame,opts={}){ if(window.__sub){finishOpts=opts;return} doFinish(frame,opts)}
function doFinish(frame,{vignette=0.55,grain=0.06}={}){
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(2,6,16,${vignette})`);
  ctx.globalCompositeOperation='source-over';ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=grain;ctx.globalCompositeOperation='overlay';
  const pat=ctx.createPattern(grains[frame%4],'repeat');ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function glowDot(x,y,r,color,a=1){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(color,a));g.addColorStop(0.25,rgba(color,a*0.5));g.addColorStop(1,rgba(color,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
}
function polyLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L}
function pointAt(pts,s){ // s in 0..1
  const L=polyLen(pts);let d=clamp(s,0,1)*L;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l||i===pts.length-1){const t=l?clamp(d/l,0,1):0;return[lerp(a[0],b[0],t),lerp(a[1],b[1],t)]}d-=l}
  return pts[pts.length-1];
}
// pulse = bright head with fading tail along a 2D polyline
function pulse(pts,head,color,{r=6,tail=0.12,n=14,a=1}={}){
  ctx.globalCompositeOperation='lighter';
  for(let k=n;k>=0;k--){const s=head-tail*(k/n);if(s<0||s>1)continue;const[x,y]=pointAt(pts,s);const f=1-k/n;glowDot(x,y,r*(0.4+0.6*f),color,a*f*f)}
  const[x,y]=pointAt(pts,clamp(head,0,1));glowDot(x,y,r*2.4,color,a*0.35);
  ctx.globalCompositeOperation='source-over';
}
function strokePoly(pts,color,w,a){ctx.strokeStyle=rgba(color,a);ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
// orthogonal PCB traces with chamfered corners
function genTraces(r,x0,y0,w,h,n,grid,{minSeg=2,maxSeg=6}={}){
  const out=[];const dirs=[[1,0],[0,1],[-1,0],[0,-1]];
  for(let i=0;i<n;i++){
    let x=x0+Math.floor(r()*w/grid)*grid,y=y0+Math.floor(r()*h/grid)*grid;let d=Math.floor(r()*4);const pts=[[x,y]];
    const segs=minSeg+Math.floor(r()*(maxSeg-minSeg));
    for(let s=0;s<segs;s++){const len=(2+Math.floor(r()*6))*grid;x+=dirs[d][0]*len;y+=dirs[d][1]*len;x=clamp(x,x0,x0+w);y=clamp(y,y0,y0+h);pts.push([x,y]);d=(d+(r()<0.5?1:3))%4}
    // chamfer
    const c=grid*0.8;const ch=[pts[0]];
    for(let k=1;k<pts.length-1;k++){const a=pts[k-1],b=pts[k],e=pts[k+1];const la=Math.hypot(b[0]-a[0],b[1]-a[1]),lb=Math.hypot(e[0]-b[0],e[1]-b[1]);if(la<c*2||lb<c*2){ch.push(b);continue}ch.push([b[0]-(b[0]-a[0])/la*c,b[1]-(b[1]-a[1])/la*c]);ch.push([b[0]+(e[0]-b[0])/lb*c,b[1]+(e[1]-b[1])/lb*c])}
    ch.push(pts[pts.length-1]);if(polyLen(ch)>grid*3)out.push(ch);
  }
  return out;
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

// ---------- scenes ----------
const scenes={};
const memo={};
function once(k,f){return memo[k]??=f()}

// HERO — motherboard landscape at dawn, camera gliding forward
scenes.hero=(p,frame)=>{
  const D=14, hz=H*0.44, f=H*0.95, camH=1.0;
  const data=once('hero',()=>{const r=rng(7);
    const traces=genTraces(r,-14,0.6,28,D-1.2,170,0.35,{minSeg:2,maxSeg:5}).map(t=>t.map(([x,y])=>[x,y]));
    const boxes=[];for(let i=0;i<46;i++){const x=(r()*2-1)*13;if(Math.abs(x)<2.2)continue;const tall=r()<0.18;boxes.push({x,z:0.6+r()*(D-1.6),w:0.4+r()*1.4,d:0.4+r()*1.2,h:tall?1.4+r()*1.8:0.12+r()*0.6,tone:r()})}
    boxes.push({x:-0.9,z:D*0.62,w:1.8,d:1.6,h:2.6,tone:0.5,cpu:true});
    const tp=traces.map(()=>({o:r(),k:1+Math.floor(r()*2),c:r()<0.7?C.cyan:(r()<0.5?C.blue:C.violet)}));
    return{traces,boxes,tp}});
  // sky
  let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#030a1a');g.addColorStop(0.45,'#13235a');g.addColorStop(0.78,'#5b3a8f');g.addColorStop(0.93,'#e0784f');g.addColorStop(1,'#ffc58a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);
  // stars fading toward horizon
  const sr=rng(3);for(let i=0;i<120;i++){const x=sr()*W,y=sr()*hz*0.6;const tw=wave(p,1+Math.floor(sr()*3),sr());ctx.fillStyle=`rgba(220,235,255,${(0.15+0.5*tw)*(1-y/(hz*0.6))})`;ctx.fillRect(x,y,1.2*S,1.2*S)}
  // sun
  const sx=W*0.5,sy=hz;glowDot(sx,sy,H*0.7,'#ff9a5c',0.5);glowDot(sx,sy,H*0.2,'#ffe2b8',0.9);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,hz);ctx.clip();ctx.fillStyle='#fff1d6';ctx.beginPath();ctx.arc(sx,sy+H*0.012,H*0.065,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='lighter';for(let i=0;i<9;i++){const a0=Math.PI+(i+0.5)/9*Math.PI+Math.sin(TAU*(p+i/9))*0.03;ctx.fillStyle='rgba(255,190,140,0.035)';ctx.beginPath();ctx.moveTo(sx,sy);ctx.arc(sx,sy,W,a0-0.04,a0+0.04);ctx.closePath();ctx.fill()}ctx.restore();ctx.globalCompositeOperation='source-over';
  // ground
  g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#3a2a52');g.addColorStop(0.08,'#13244a');g.addColorStop(0.5,'#08162f');g.addColorStop(1,'#030a18');
  ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
  // sun reflection path on the board
  g=ctx.createLinearGradient(sx-W*0.18,0,sx+W*0.18,0);g.addColorStop(0,'rgba(255,160,100,0)');g.addColorStop(0.5,'rgba(255,170,110,0.22)');g.addColorStop(1,'rgba(255,160,100,0)');ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
  const proj=(x,z,y=0)=>[W/2+x*f/z,hz+(camH-y)*f/z];
  const fog=z=>clamp(1-(z-1.5)/(D*2.4),0,1);
  const off=p*D;
  // traces on ground
  for(let tile=0;tile<4;tile++){
    data.traces.forEach((tr,i)=>{
      const pts=tr.map(([x,z])=>[x,z+tile*D-off]).filter(q=>q[1]>0.35);if(pts.length<2)return;
      const zAvg=pts.reduce((s,q)=>s+q[1],0)/pts.length;const a=fog(zAvg);if(a<=0.02)return;
      const sp=pts.map(([x,z])=>proj(x,z));
      ctx.globalCompositeOperation='lighter';strokePoly(sp,data.tp[i].c,Math.max(1.5,9*S/zAvg),0.08*a);strokePoly(sp,data.tp[i].c,Math.max(0.8,2.8*S/zAvg*2),0.5*a);ctx.globalCompositeOperation='source-over';
      // vias at ends
      const e=sp[sp.length-1];ctx.strokeStyle=rgba(C.cyan,0.5*a);ctx.lineWidth=1;ctx.beginPath();ctx.arc(e[0],e[1],Math.max(1.2,5*S/zAvg),0,TAU);ctx.stroke();
      const tp=data.tp[i];const head=(p*tp.k+tp.o)%1;pulse(sp,head,tp.c,{r:Math.max(2,10*S/zAvg),a:a,tail:0.18});
    });
  }
  // boxes far → near
  const bx=[];for(let tile=0;tile<4;tile++)data.boxes.forEach(b=>bx.push({...b,z:b.z+tile*D-off}));
  bx.filter(b=>b.z>0.5).sort((a,b)=>b.z-a.z).forEach(b=>{
    if(b.z<2.6)return;const a=fog(b.z)*clamp((b.z-2.6)/2,0,1);if(a<=0.02)return;const x0=b.x-b.w/2,x1=b.x+b.w/2,z0=b.z,z1=b.z+b.d;
    const q=(x,z,y)=>proj(x,z,y);
    const F=[q(x0,z0,0),q(x1,z0,0),q(x1,z0,b.h),q(x0,z0,b.h)];
    const Tp=[q(x0,z0,b.h),q(x1,z0,b.h),q(x1,z1,b.h),q(x0,z1,b.h)];
    const side=b.x>0?[q(x0,z0,0),q(x0,z1,0),q(x0,z1,b.h),q(x0,z0,b.h)]:[q(x1,z0,0),q(x1,z1,0),q(x1,z1,b.h),q(x1,z0,b.h)];
    const poly=(pts,fill)=>{ctx.fillStyle=fill;ctx.beginPath();pts.forEach((pt,i)=>i?ctx.lineTo(...pt):ctx.moveTo(...pt));ctx.closePath();ctx.fill()};
    const fogMix=(c)=>c; // colours already dark; alpha handles fog
    ctx.globalAlpha=a;
    poly(side,'#0a1834');
    const fg=ctx.createLinearGradient(0,F[3][1],0,F[0][1]);fg.addColorStop(0,b.cpu?'#1b2e5c':'#12264c');fg.addColorStop(1,'#071229');poly(F,fg);
    poly(Tp,b.cpu?'#2a3f78':'#1a315f');
    // rim light from the sun
    ctx.strokeStyle=rgba('#ffb889',0.55);ctx.lineWidth=Math.max(0.6,1.4*S/b.z*2);ctx.beginPath();ctx.moveTo(...Tp[3]);ctx.lineTo(...Tp[2]);ctx.stroke();
    ctx.strokeStyle=rgba(C.cyan,0.6);ctx.beginPath();ctx.moveTo(...F[3]);ctx.lineTo(...F[2]);ctx.stroke();
    // pins / windows
    // side windows
    if(b.h>0.5){const rs=Math.floor(b.h*7),cs=Math.max(2,Math.floor(b.d*5));for(let i=0;i<cs;i++)for(let j=0;j<rs;j++){const u=(i+0.5)/cs,v=(j+0.6)/rs;const X=lerp(lerp(side[0][0],side[1][0],u),lerp(side[3][0],side[2][0],u),v),Y=lerp(lerp(side[0][1],side[1][1],u),lerp(side[3][1],side[2][1],u),v);const on=wave(p,1+((i*5+j)%2),((i*11+j*5)%10)/10);ctx.fillStyle=rgba(C.blue,0.15+0.4*on);const sz=Math.max(0.7,2*S/b.z*1.3);ctx.fillRect(X-sz/2,Y-sz/2,sz,sz)}}
    const rows=b.h>0.5?Math.floor(b.h*7):1,cols=Math.max(2,Math.floor(b.w*6));
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const u=(i+0.5)/cols,v=b.h>0.5?(j+0.6)/rows:0.15;const X=lerp(F[0][0],F[1][0],u),Y=lerp(F[0][1],F[3][1],v);const on=b.h>0.5?wave(p,1+((i*7+j*3)%3),(i*13+j*7)%10/10):1;
      ctx.fillStyle=rgba(b.h>0.5?C.cyanL:C.gold,(b.h>0.5?0.25+0.7*on:0.8));const s=Math.max(0.8,2.6*S/b.z*1.3);ctx.fillRect(X-s/2,Y-s/2,s,s)}
    if(b.cpu){const c=[(F[2][0]+F[3][0])/2,F[3][1]];ctx.globalCompositeOperation='lighter';glowDot(c[0],c[1],60*S,C.cyan,0.35+0.25*wave(p,2));ctx.globalCompositeOperation='source-over'}
    ctx.globalAlpha=1;
  });
  // horizon haze
  g=ctx.createLinearGradient(0,hz-H*0.08,0,hz+H*0.12);g.addColorStop(0,'rgba(255,170,120,0)');g.addColorStop(0.45,'rgba(255,170,130,0.35)');g.addColorStop(1,'rgba(90,60,140,0)');ctx.fillStyle=g;ctx.fillRect(0,hz-H*0.08,W,H*0.2);
  // lens flare
  ctx.globalCompositeOperation='lighter';
  [[0.25,40,'#ffb889',0.12],[0.55,22,C.cyan,0.12],[0.8,60,C.violet,0.08]].forEach(([t,r,c,a])=>glowDot(lerp(sx,W*0.72,t),lerp(sy,H*0.88,t),r*S,c,a*(0.8+0.2*wave(p))));
  ctx.globalCompositeOperation='source-over';
  finish(frame);
};

// SERVER HALL — dolly down a data-centre aisle
function hall(p,frame,{move=8,dim=false}={}){
  const hz=H*0.47,f=H*0.85,camY=1.0,XW=1.25,RH=2.3;
  ctx.fillStyle='#02060f';ctx.fillRect(0,0,W,H);
  const proj=(x,y,z)=>[W/2+x*f/z,hz+(camY-y)*f/z];
  const off=dim?0:p*move;
  // vanishing glow
  glowDot(W/2,hz,H*0.6,dim?'#0b2a4a':'#1d4ed8',dim?0.25:0.4);
  // ceiling light strips
  for(let k=0;k<40;k++){const z=k+1-(off%1);if(z<0.6)continue;const a=clamp(1-z/34,0,1);const[x0,y0]=proj(-0.25,RH+0.15,z),[x1]=proj(0.25,RH+0.15,z);const[,y1]=proj(0,RH+0.15,z+0.5);ctx.fillStyle=rgba(dim?'#3b5578':C.cyanL,(dim?0.05:0.55)*a);ctx.fillRect(x0,y0,x1-x0,Math.max(1,y1-y0));if(!dim&&z<16){ctx.globalCompositeOperation='lighter';glowDot((x0+x1)/2,y0,(x1-x0)*1.4,C.cyan,0.12*a);ctx.globalCompositeOperation='source-over'}}
  // floor
  let g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#071a33');g.addColorStop(1,'#020812');ctx.fillStyle=g;ctx.fillRect(0,hz+f*camY/40,W,H);
  const rack=(side,z0,idx)=>{const x=side*XW;const z1=z0+0.92;const a=clamp(1-z0/30,0,1);if(a<=0)return;
    const P=[proj(x,0,z0),proj(x,0,z1),proj(x,RH,z1),proj(x,RH,z0)];
    ctx.fillStyle=`rgba(10,22,44,${0.95})`;ctx.beginPath();P.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.closePath();ctx.fill();
    ctx.strokeStyle=rgba(C.blue,0.35*a);ctx.lineWidth=Math.max(1,2*S/z0);ctx.stroke();for(let u=1;u<8;u++){const yy=u*RH/8;const[a1,b1]=proj(x,yy,z0),[a2,b2]=proj(x,yy,z1);ctx.strokeStyle=rgba(C.blue,0.12*a);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a1,b1);ctx.lineTo(a2,b2);ctx.stroke()}
    const r=rng(1000+((idx%8)+8)%8*31+(side>0?7:0));const rows=16,cols=4;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){if(r()<0.25)continue;const zz=lerp(z0+0.12,z1-0.12,(i+0.5)/cols),yy=0.18+j*(RH-0.35)/rows;
      const ph=r(),col=r()<0.75?C.cyan:(r()<0.6?C.blue:C.green);
      let on;if(dim){on=0.08}else{const wv=Math.sin(TAU*(p*2 + zz*0.09 + ph*0.3));on=clamp(0.5+0.7*wv,0,1)*(r()<0.18?wave(p,4,ph):1)}
      const[sx,sy]=proj(x,yy,zz);const s=Math.max(1.4,8*S/zz*1.3);
      ctx.fillStyle=rgba(col,(0.15+0.85*on)*a);ctx.fillRect(sx-s/2,sy-s/3,s,s*0.66);
      if(on>0.6&&zz<16){ctx.globalCompositeOperation='lighter';glowDot(sx,sy,s*5,col,0.5*a*on);
        // floor reflection
        const[,ry]=proj(x,-yy,zz);glowDot(sx,ry,s*3,col,0.12*a*on);ctx.globalCompositeOperation='source-over'}
    }};
  for(let k=39;k>=0;k--){const z=k+1-(off%1);const idx=k+Math.floor(off);if(z<0.25)continue;rack(-1,z,idx);rack(1,z,idx+3)}
  // volumetric light shafts from the ceiling strips
  if(!dim){ctx.globalCompositeOperation='lighter';for(let k=0;k<14;k++){const z=k*2.2+1-(off*1%2.2);if(z<0.8)continue;const a=clamp(1-z/30,0,1);const[x0,y0]=proj(-0.3,RH+0.1,z),[x1]=proj(0.3,RH+0.1,z);const[xf0,yf]=proj(-1.1,0,z+0.4),[xf1]=proj(1.1,0,z+0.4);const g2=ctx.createLinearGradient(0,y0,0,yf);g2.addColorStop(0,rgba(C.cyanL,0.1*a));g2.addColorStop(1,rgba(C.cyan,0));ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y0);ctx.lineTo(xf1,yf);ctx.lineTo(xf0,yf);ctx.closePath();ctx.fill()}ctx.globalCompositeOperation='source-over'}
  // mist along floor
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<9;i++){const x=W*((i/9+p*0.5*(i%2?1:-1))%1+1)%1;glowDot(x,H*0.86+Math.sin(TAU*(p+i/9))*H*0.02,H*0.32,'#5b9dff',dim?0.03:0.06)}
  ctx.globalCompositeOperation='source-over';
}
scenes.hall=(p,frame)=>{hall(p,frame);finish(frame)};

// SIGNAL LOST — same corridor, dark, one flickering rack
scenes.lost=(p,frame)=>{
  hall(p,frame,{dim:true});
  const hz=H*0.47,f=H*0.85;const z=9;const x=W/2-1.25*f/z,y=hz+(1.0-1.4)*f/z;
  const r=rng(Math.floor(p*48));const fl=(Math.sin(TAU*p*3)>0.2?1:0.25)*(r()<0.85?1:0.1);
  ctx.globalCompositeOperation='lighter';glowDot(x+6*S,y,120*S,C.cyan,0.35*fl);glowDot(x+6*S,y,18*S,C.cyanL,0.9*fl);
  // light cone + dust
  const dr=rng(5);for(let i=0;i<70;i++){const px=x+(dr()-0.3)*W*0.35,py=((dr()+p*(0.3+dr()*0.3))%1)*H;glowDot(px,py,1.6*S,C.cyanL,0.25*fl*dr())}
  ctx.globalCompositeOperation='source-over';
  // glitch slices at two moments in the loop
  if((p>0.31&&p<0.34)||(p>0.72&&p<0.74)){const img=ctx.getImageData(0,0,W,H);const gr=rng(frame);for(let k=0;k<6;k++){const y0=Math.floor(gr()*H),h=Math.floor(4+gr()*24*S),dx=Math.floor((gr()-0.5)*60*S);const slice=ctx.getImageData(0,y0,W,h);ctx.putImageData(slice,dx,y0)}ctx.fillStyle=rgba(C.cyan,0.04);ctx.fillRect(0,0,W,H)}
  finish(frame,{vignette:0.7});
};

// SYDNEY ONLINE — harbour skyline at night with data arcs
scenes.city=(p,frame)=>{
  const z=1+0.045*wave(p);ctx.save();ctx.translate(W/2,H*0.55);ctx.scale(z,z);ctx.translate(-W/2,-H*0.55);
  const wl=H*0.64; // waterline

      const r=rng(Math.floor(b.x*7));for(let yy=wl-b.h+6*S;yy<wl-4*S;yy+=7*S)for(let xx=b.x+4*S;xx<b.x+b.w-4*S;xx+=6*S){const v=r();if(v<0.45)continue;const tw=v>0.97?wave(p,2,v*10):1;c.fillStyle=v>0.9?rgba(C.cyanL,0.85*tw):v>0.75?rgba('#ffd6a0',0.7*tw):rgba(C.blue,0.55*tw);c.fillRect(xx,yy,2.4*S,3*S)}

// CIRCUIT MACRO — PCB slider with sparks into a chip, shallow DOF
scenes.circuit=(p,frame,{portrait=false}={})=>{
  const data=once('circ'+W,()=>{const r=rng(11);const traces=genTraces(r,-W*0.2,-H*0.2,W*1.4,H*1.4,140,22*S,{minSeg:2,maxSeg:6});
    const chip={x:W*0.5,y:H*0.5,s:Math.min(W,H)*0.26};
    const feeds=[];for(let i=0;i<16;i++){const side=i%4,t=(Math.floor(i/4)+0.5)/4;const s=chip.s;let x0,y0,dx,dy;if(side===0){x0=chip.x-s/2+t*s;y0=chip.y-s/2;dx=0;dy=-1}else if(side===1){x0=chip.x+s/2;y0=chip.y-s/2+t*s;dx=1;dy=0}else if(side===2){x0=chip.x-s/2+t*s;y0=chip.y+s/2;dx=0;dy=1}else{x0=chip.x-s/2;y0=chip.y-s/2+t*s;dx=-1;dy=0}
      const L=(120+r()*260)*S,k=(40+r()*80)*S;const pts=[[x0+dx*L+(dy?k:0),y0+dy*L+(dx?k:0)],[x0+dx*(L*0.45)+(dy?k*0.4:0),y0+dy*(L*0.45)+(dx?k*0.4:0)],[x0+dx*8*S,y0+dy*8*S],[x0,y0]];feeds.push({pts,o:r(),k:1+Math.floor(r()*3)})}
    return{traces,chip,feeds}});
  const off=once('circOff'+W,()=>{const o=document.createElement('canvas');o.width=W;o.height=H;return o});const ox=off.getContext('2d');
  const draw=(c)=>{const old=ctx;
    c.fillStyle='#04121f';c.fillRect(0,0,W,H);let g=c.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'#0b3346');g.addColorStop(1,'#03101b');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.save();c.translate(Math.sin(TAU*p)*40*S,Math.cos(TAU*p)*12*S);
    data.traces.forEach(t=>{c.strokeStyle='rgba(212,168,74,0.32)';c.lineWidth=3.2*S;c.lineJoin='round';c.beginPath();t.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.stroke();const e=t[t.length-1];c.fillStyle='rgba(212,168,74,0.5)';c.beginPath();c.arc(e[0],e[1],4.5*S,0,TAU);c.fill();c.fillStyle='#04121f';c.beginPath();c.arc(e[0],e[1],2*S,0,TAU);c.fill()});
    data.feeds.forEach(fd=>{c.strokeStyle='rgba(230,190,90,0.55)';c.lineWidth=3*S;c.beginPath();fd.pts.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.stroke()});
    const ch=data.chip;const heat=0.4+0.6*wave(p,2);
    g=c.createLinearGradient(ch.x-ch.s/2,ch.y-ch.s/2,ch.x+ch.s/2,ch.y+ch.s/2);g.addColorStop(0,'#1c2433');g.addColorStop(1,'#080c14');c.fillStyle=g;c.beginPath();c.roundRect(ch.x-ch.s/2,ch.y-ch.s/2,ch.s,ch.s,10*S);c.fill();
    c.strokeStyle=rgba(C.cyan,0.35+0.4*heat);c.lineWidth=2*S;c.stroke();
    for(let i=0;i<20;i++){const t=(i+0.5)/20;[[ch.x-ch.s/2+t*ch.s,ch.y-ch.s/2-6*S],[ch.x-ch.s/2+t*ch.s,ch.y+ch.s/2+6*S],[ch.x-ch.s/2-6*S,ch.y-ch.s/2+t*ch.s],[ch.x+ch.s/2+6*S,ch.y-ch.s/2+t*ch.s]].forEach(([x,y])=>{c.fillStyle='rgba(220,180,90,0.9)';c.fillRect(x-2*S,y-3*S,4*S,6*S)})}
    c.restore();return heat};
  const prev=ctx;const heat=draw(ox);
  // blurred base + sharp centre (depth of field)

  const sharp=once('circSharp'+W,()=>{const o=document.createElement('canvas');o.width=W;o.height=H;return o});const sx=sharp.getContext('2d');sx.clearRect(0,0,W,H);sx.drawImage(off,0,0);
  sx.globalCompositeOperation='destination-in';let g=sx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.18,W/2,H/2,Math.min(W,H)*0.6);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=g;sx.fillRect(0,0,W,H);sx.globalCompositeOperation='source-over';

// ---------- product-shot helpers ----------
function studio(p,{spot=C.blue,floor=0.62}={}){
  ctx.fillStyle='#030916';ctx.fillRect(0,0,W,H);
  glowDot(W*0.5,H*0.42,Math.max(W,H)*0.75,spot,0.28);
  glowDot(W*(0.3+0.4*wave(p)),H*0.2,Math.max(W,H)*0.5,C.violet,0.1);
  const g=ctx.createLinearGradient(0,H*floor,0,H);g.addColorStop(0,'rgba(20,40,80,0.35)');g.addColorStop(1,'rgba(2,6,14,0.9)');ctx.fillStyle=g;ctx.fillRect(0,H*floor,W,H);

}
// diagonal light sweep clipped to the current path
function sweep(p,x,y,w,h,{k=1,color='#ffffff',a=0.35,width=0.18}={}){
  const t=((p*k)%1)*1.8-0.4;const cx=x+w*t;const g=ctx.createLinearGradient(cx-w*width,y,cx+w*width,y+h*0.3);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,rgba(color,a));g.addColorStop(1,'rgba(255,255,255,0)');ctx.save();ctx.clip();ctx.fillStyle=g;ctx.fillRect(x-w,y-h,w*3,h*3);ctx.restore();
}
function reflect(drawFn,yFloor,alpha=0.22){ // mirror what drawFn draws below yFloor
  ctx.save();ctx.translate(0,yFloor*2);ctx.scale(1,-1);ctx.globalAlpha=alpha;drawFn();ctx.restore();ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,yFloor,0,H);g.addColorStop(0,'rgba(3,9,22,0.2)');g.addColorStop(0.5,'rgba(3,9,22,0.9)');ctx.fillStyle=g;ctx.fillRect(0,yFloor,W,H-yFloor);
}

// DATA CENTRE CAMPUS — aerial at blue hour
scenes.campus=(p,frame)=>{
  ctx.fillStyle='#050d22';ctx.fillRect(0,0,W,H);
  const hz=H*0.22;let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#0b1a45');g.addColorStop(1,'#3b3a8a');ctx.fillStyle=g;ctx.fillRect(0,0,W,hz);
  glowDot(W*0.7,hz,H*0.5,'#7c5cff',0.35);
  // clouds (timelapse)
  for(let i=0;i<6;i++){const x=((i/6+p)%1)*W*1.4-W*0.2;glowDot(x,hz*0.55+i%3*10*S,180*S,'#8aa0d8',0.12)}
  g=ctx.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#2a2f6e');g.addColorStop(0.15,'#0d1d40');g.addColorStop(1,'#040a18');ctx.fillStyle=g;ctx.fillRect(0,hz,W,H-hz);
  const hg=ctx.createLinearGradient(0,hz-40*S,0,hz+60*S);hg.addColorStop(0,'rgba(124,92,255,0)');hg.addColorStop(0.45,'rgba(150,120,255,0.35)');hg.addColorStop(1,'rgba(40,60,140,0)');ctx.fillStyle=hg;ctx.fillRect(0,hz-40*S,W,100*S);
  // ground plane in perspective, gentle orbit
  const ang=Math.sin(TAU*p)*0.14,f=H*1.15,camH=6.5;
  const proj=(x,z,y=0)=>{const xr=x*Math.cos(ang)-z*Math.sin(ang),zr=x*Math.sin(ang)+z*Math.cos(ang)+17;return[W/2+xr*f/zr,hz+(camH-y)*f/zr,zr]};
  const quad=(pts,fill)=>{ctx.fillStyle=fill;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill()};
  // roads with light trails
  const roads=[[-6,-6,6,-6],[-6,0.2,6,0.2],[-6,6,6,6],[-2.4,-8,-2.4,9],[2.4,-8,2.4,9]];
  roads.forEach(([x0,z0,x1,z1],i)=>{const a=proj(x0,z0),b=proj(x1,z1);ctx.strokeStyle='rgba(60,90,150,0.6)';ctx.lineWidth=3*S;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    for(let c=0;c<5;c++){const t=((p*(1+i%2)+c/5+i*0.13)%1);const t2=t-0.06;if(t2<0)continue;const A=proj(lerp(x0,x1,t),lerp(z0,z1,t)),B=proj(lerp(x0,x1,t2),lerp(z0,z1,t2));ctx.globalCompositeOperation='lighter';ctx.strokeStyle=rgba(c%2?C.amber:'#ff5b5b',0.8);ctx.lineWidth=2*S;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();glowDot(A[0],A[1],6*S,c%2?C.amber:'#ff5b5b',0.6);ctx.globalCompositeOperation='source-over'}});
  // buildings
  const blds=[];[-4.2,0,4.2].forEach(bx=>[-3,3].forEach(bz=>blds.push({x:bx,z:bz,w:3.2,d:4.6,h:0.7})));
  blds.map(b=>({...b,zz:proj(b.x,b.z)[2]})).sort((a,b)=>b.zz-a.zz).forEach((b,bi)=>{
    const x0=b.x-b.w/2,x1=b.x+b.w/2,z0=b.z-b.d/2,z1=b.z+b.d/2;
    const top=[proj(x0,z0,b.h),proj(x1,z0,b.h),proj(x1,z1,b.h),proj(x0,z1,b.h)];
    quad([proj(x0,z0,0),proj(x1,z0,0),proj(x1,z0,b.h),proj(x0,z0,b.h)],'#0e1f45');
    quad([proj(x1,z0,0),proj(x1,z1,0),proj(x1,z1,b.h),proj(x1,z0,b.h)],'#0a1736');

    ctx.strokeStyle=rgba(C.cyan,0.5);ctx.lineWidth=1.2*S;ctx.beginPath();top.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();
    // cooling vents
    for(let i=0;i<3;i++)for(let j=0;j<5;j++){const u=(i+0.5)/3,v=(j+0.5)/5;const X=x0+u*b.w,Z=z0+v*b.d;const q=proj(X,Z,b.h);const on=wave(p,2,(i+j*3+bi)/9);ctx.globalCompositeOperation='lighter';glowDot(q[0],q[1],(16*S)*17/q[2],C.cyan,0.3+0.6*on);ctx.globalCompositeOperation='source-over'}

  finish(frame);
};

// FIBRE — bundle with racing light; portrait variant falls like a waterfall
scenes.fibre=(p,frame)=>{

  const data=once('fib'+W,()=>{const r=rng(31);const n=portrait?70:90;const out=[];for(let i=0;i<n;i++){const s=(r()-0.5);let pts=[];
    for(let k=0;k<=30;k++){const t=k/30;if(portrait){const x=W*(0.5+s*0.25*(1-t*0.2))+Math.sin(t*3+i)*W*0.04*t+s*W*0.7*t*t;const y=t*H*1.05-H*0.02;pts.push([x,y])}else{const x=t*W*1.08-W*0.04;const y=H*(0.5+s*0.08)+s*H*0.9*t*t+Math.sin(t*4+i)*H*0.02;pts.push([x,y])}}

// NEURAL NETWORK — 3D graph with firing pulses
scenes.neural=(p,frame)=>{
  ctx.fillStyle='#030817';ctx.fillRect(0,0,W,H);glowDot(W/2,H/2,Math.max(W,H)*0.6,'#1e2a6b',0.5);
  const data=once('nn',()=>{const r=rng(41);const nodes=[];const layers=7;for(let l=0;l<layers;l++){const n=10+Math.floor(r()*8);for(let i=0;i<n;i++){const a=r()*TAU,rad=0.4+r()*1.2;nodes.push({x:(l-(layers-1)/2)*0.9,y:Math.sin(a)*rad,z:Math.cos(a)*rad,l})}}
    const edges=[];nodes.forEach((a,i)=>nodes.forEach((b,j)=>{if(b.l===a.l+1&&r()<0.28)edges.push({a:i,b:j,o:r(),k:1+Math.floor(r()*2)})}));return{nodes,edges}});

// AI CHIP — heartbeat pulses outward
scenes.aichip=(p,frame)=>{

  let g=ctx.createLinearGradient(-cs/2,-cs/2,cs/2,cs/2);g.addColorStop(0,'#1e293b');g.addColorStop(1,'#060b16');ctx.fillStyle=g;rr(-cs/2,-cs/2,cs,cs,18*S);ctx.fill();
  ctx.strokeStyle=rgba(C.cyan,0.5+0.5*b);ctx.lineWidth=2.5*S;ctx.stroke();
  g=ctx.createLinearGradient(-cs*0.3,-cs*0.3,cs*0.3,cs*0.3);g.addColorStop(0,'#312e81');g.addColorStop(1,'#0e7490');ctx.fillStyle=g;rr(-cs*0.3,-cs*0.3,cs*0.6,cs*0.6,10*S);ctx.fill();
  for(let i=0;i<6;i++)for(let j=0;j<6;j++){ctx.fillStyle=rgba(C.cyanL,0.15+0.6*b*wave(p,2,(i+j)/12));ctx.fillRect(-cs*0.26+i*cs*0.09,-cs*0.26+j*cs*0.09,cs*0.06,cs*0.06)}
